<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="description" content="むつむつ — リンク一覧ページ">
    <title>LINKS — むつむつ / むつむつプロジェクト</title>
    <link rel="icon" type="image/png" href="./images/Merry_icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=New+Tegomin&family=Rock+3D&family=Shippori+Mincho:wght@400;700&display=swap" rel="stylesheet">
    <style>
    /* ── Variables ── */
    :root {
        --clr-bg:         #060608;
        --clr-surface:    rgba(12, 11, 15, 0.90);
        --clr-accent:     #c0002a;
        --clr-accent-dim: rgba(192, 0, 42, 0.18);
        --clr-text:       #ddd8d0;
        --clr-text-muted: #6e6a65;
        --clr-border:     rgba(192, 0, 42, 0.28);
        --font-display:   'Rock 3D', cursive;
        --font-body:      'Shippori Mincho', 'New Tegomin', serif;
        --ease-horror:    cubic-bezier(.22, .61, .36, 1);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
        background-color: var(--clr-bg);
        color: var(--clr-text);
        font-family: var(--font-body);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow-x: hidden;
    }
    a { text-decoration: none; color: inherit; }
    img { display: block; max-width: 100%; }

    /* ── Background effects ── */
    .noise-overlay {
        position: fixed; inset: 0; z-index: 0; pointer-events: none;
        opacity: 0.03;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        background-size: 200px;
        animation: noise-shift 0.15s steps(2) infinite;
    }
    @keyframes noise-shift {
        0%   { background-position: 0 0; }
        50%  { background-position: 30px -20px; }
        100% { background-position: -10px 10px; }
    }
    .bg-glow {
        position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background: radial-gradient(ellipse 60% 50% at 50% 0%,
            rgba(192, 0, 42, 0.10) 0%, transparent 65%);
    }

    /* ── Page wrapper ── */
    .links-page {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 520px;
        padding: clamp(48px, 8vh, 80px) clamp(20px, 5vw, 40px) clamp(48px, 8vh, 72px);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0;
    }

    /* ── Back link ── */
    .back-link {
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        letter-spacing: 0.2em;
        color: var(--clr-text-muted);
        margin-bottom: 36px;
        transition: color 0.2s;
    }
    .back-link:hover { color: var(--clr-text); }
    .back-link svg { flex-shrink: 0; }

    /* ── Profile ── */
    .profile {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        margin-bottom: 12px;
        animation: profileReveal 0.9s var(--ease-horror) 0.1s both;
    }
    @keyframes profileReveal {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .profile__avatar {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        overflow: hidden;
        border: 2px solid var(--clr-border);
        background: #0d0d0f;
        position: relative;
    }
    .profile__avatar::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        box-shadow: 0 0 0 4px var(--clr-accent-dim);
        transition: box-shadow 0.4s;
    }
    .profile__avatar:hover::after {
        box-shadow: 0 0 0 6px rgba(192,0,42,0.35);
    }
    .profile__avatar img {
        width: 100%; height: 100%; object-fit: cover;
    }

    .profile__name {
        font-family: var(--font-display);
        font-size: clamp(22px, 5vw, 28px);
        color: var(--clr-text);
        letter-spacing: 0.06em;
        line-height: 1;
    }
    .profile__role {
        font-size: 11px;
        letter-spacing: 0.25em;
        color: var(--clr-accent);
        text-transform: uppercase;
    }

    /* ── Description ── */
    .profile__desc {
        font-size: 13px;
        color: var(--clr-text-muted);
        letter-spacing: 0.1em;
        text-align: center;
        line-height: 1.8;
        padding: 12px 16px;
        border: 1px dashed rgba(255,255,255,0.08);
        border-radius: 3px;
        width: 100%;
        margin-bottom: 32px;
        animation: profileReveal 0.9s var(--ease-horror) 0.25s both;
    }
    .profile__desc span {
        color: var(--clr-text);
    }

    /* ── Divider ── */
    .links-divider {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
        animation: profileReveal 0.9s var(--ease-horror) 0.35s both;
    }
    .links-divider::before,
    .links-divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: linear-gradient(to right, transparent, var(--clr-border), transparent);
    }
    .links-divider__label {
        font-size: 9px;
        letter-spacing: 0.4em;
        color: var(--clr-text-muted);
        text-transform: uppercase;
        white-space: nowrap;
    }

    /* ── Link list ── */
    .links-list {
        list-style: none;
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    /* ── Link item ── */
    .link-item {
        opacity: 0;
        transform: translateY(12px);
        animation: linkReveal 0.5s var(--ease-horror) both;
    }
    /* stagger delay は JS で付与 */
    @keyframes linkReveal {
        to { opacity: 1; transform: translateY(0); }
    }

    .link-item a {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 18px;
        background: var(--clr-surface);
        border: 1px solid rgba(255,255,255,0.07);
        border-radius: 4px;
        transition: border-color 0.25s, background 0.25s, transform 0.2s, box-shadow 0.3s;
        position: relative;
        overflow: hidden;
    }
    .link-item a::before {
        content: '';
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 3px;
        background: var(--clr-accent);
        transform: scaleY(0);
        transform-origin: bottom;
        transition: transform 0.3s var(--ease-horror);
    }
    .link-item a:hover::before { transform: scaleY(1); }
    .link-item a:hover {
        border-color: var(--clr-border);
        background: rgba(192,0,42,0.05);
        transform: translateX(4px);
        box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }

    /* アイコン枠 */
    .link-item__icon {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.08);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        color: var(--clr-text-muted);
        transition: color 0.25s, background 0.25s;
    }
    .link-item a:hover .link-item__icon {
        color: var(--clr-text);
        background: rgba(192,0,42,0.15);
        border-color: var(--clr-border);
    }

    /* テキスト */
    .link-item__text {
        display: flex;
        flex-direction: column;
        gap: 2px;
        flex: 1;
        min-width: 0;
    }
    .link-item__label {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: var(--clr-text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .link-item__sub {
        font-size: 11px;
        letter-spacing: 0.08em;
        color: var(--clr-text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* 矢印 */
    .link-item__arrow {
        color: var(--clr-text-muted);
        flex-shrink: 0;
        transition: color 0.25s, transform 0.25s;
    }
    .link-item a:hover .link-item__arrow {
        color: var(--clr-accent);
        transform: translateX(3px);
    }

    /* セクション見出し（グループ分け） */
    .links-group-label {
        width: 100%;
        font-size: 9px;
        letter-spacing: 0.4em;
        color: var(--clr-text-muted);
        text-transform: uppercase;
        margin: 20px 0 8px;
        padding-left: 4px;
        opacity: 0;
        animation: profileReveal 0.5s var(--ease-horror) 0.4s both;
    }

    /* ── Footer ── */
    .links-footer {
        margin-top: 40px;
        font-size: 11px;
        color: var(--clr-text-muted);
        letter-spacing: 0.15em;
        text-align: center;
        opacity: 0;
        animation: profileReveal 0.6s var(--ease-horror) 1s both;
    }
    .links-footer a {
        color: var(--clr-accent);
        border-bottom: 1px solid var(--clr-accent-dim);
        transition: border-color 0.2s;
    }
    .links-footer a:hover { border-color: var(--clr-accent); }
    </style>
</head>
